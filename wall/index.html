<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#121518"><title>领克 · 勋章墙</title><style>
:root{color-scheme:dark;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{margin:0;background:#121518;color:#e6e9e9;min-height:100svh;display:grid;place-content:center;padding:0 29px}main{max-width:340px}small{font:10px/1.5 ui-monospace,monospace;letter-spacing:.18em;color:#a0a6aa}h1{margin:.6em 0;font-weight:500;font-size:24px}p{margin:.5em 0;color:#a0a6aa}button{font:inherit;margin-top:14px;background:#d3e3e6;color:#121518;border:0;border-radius:30px;padding:8px 25px}[hidden]{display:none}progress{width:100%;height:2px;accent-color:#7fdccf}</style></head><body><main aria-live="polite"><small>LYNK &amp; CO · MEDAL WALL</small><h1 id="title">正在打开勋章墙</h1><p id="desc"></p><progress id="bar"></progress><button id="retry" hidden>重新加载</button></main><script>
'use strict';const el=id=>document.getElementById(id);
function message(title,desc,retry){el('title').textContent=title;el('desc').textContent=desc;el('bar').hidden=true;el('retry').hidden=!retry}
el('retry').onclick=()=>location.reload();
(async()=>{
const k=new URLSearchParams(location.hash.slice(1)).get('k');
if(!k||!/^[-_A-Za-z0-9]{43}$/.test(k)){message('请打开完整的体验链接','使用原消息中的链接或二维码。仅输入网址首页无法打开这个预览。',false);return}
if(!globalThis.crypto?.subtle){message('请在系统浏览器中打开','复制完整链接，用 Safari 或 Chrome 打开。',false);return}
let encrypted;
try{const r=await fetch('./preview.bin?v=8c31854a9d5e',{credentials:'omit'});if(!r.ok)throw Error(r.status);encrypted=new Uint8Array(await r.arrayBuffer())}catch{message('页面未下载完成','检查网络后再试一次。',true);return}
try{const keyBytes=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:encrypted.subarray(0,12)},key,encrypted.subarray(12));const page=new TextDecoder().decode(clear);document.open();document.write(page);document.close()}catch{message('无法打开这个预览','请从原消息重新复制完整链接，或重新扫码。',false)}
})();
</script></body></html>
